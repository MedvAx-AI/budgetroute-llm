name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development package
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Format
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Tests and coverage
        run: python -m pytest --cov=budgetroute --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=75
      - name: Thin Colab notebook contract (offline, no GPU claim)
        run: python -m pytest tests/integration/test_colab_contract.py
      - name: Build distributions
        run: python -m build
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python-3.12
          path: coverage.xml

  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: budgetroute_test
          POSTGRES_USER: budgetroute_test
          POSTGRES_PASSWORD: budgetroute_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budgetroute_test -d budgetroute_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      BUDGETROUTE_TEST_POSTGRES_DSN: >-
        postgresql://budgetroute_test:budgetroute_test@127.0.0.1:5432/budgetroute_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PostgreSQL test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,postgres]'
      - name: PostgreSQL migration, parity, and concurrency contract
        run: python -m pytest tests/integration/test_postgres_operational_store.py
